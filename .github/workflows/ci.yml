name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [chisel35, chisel36, chisel5, chisel6, chisel7]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install -r tb/requirements.txt
      - run: ./test.sh ${{ matrix.group }}
